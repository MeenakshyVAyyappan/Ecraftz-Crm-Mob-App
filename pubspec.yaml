version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  intl: ^0.19.0
  supabase_flutter: ^2.8.0
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
