name: ecraftz_crm
description: Ecraftz CRM Mobile Application - Premium Light Theme

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  intl: ^0.19.0
  supabase_flutter: ^2.8.0
  flutter_bloc: ^8.1.6
  provider: ^6.1.2
  equatable: ^2.0.5
  url_launcher: ^6.3.2
  file_picker: ^8.1.7
  pdf: ^3.11.1
  printing: ^5.13.2
  shared_preferences: ^2.5.5
  font_awesome_flutter: ^11.0.0
  http: ^1.6.0
  xml: ^6.6.1
  excel: ^4.0.6
  firebase_core: ^3.14.0
  firebase_messaging: ^15.2.7
  flutter_local_notifications: ^17.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/ecraftzlogodark.png
    - assets/ecraftzlogolight.png
    - assets/logo3d.png
    - assets/logo001.png
    - assets/app_icon_master.png
    - assets/app_icon_foreground.png
    - assets/splash_3d_a12.png
    - assets/logosplash.png
    - assets/splashscreenlogo.png
    - assets/splash_a12_safe.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon_master.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app_icon_foreground.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#0D1B2A"
  image: "assets/splashscreenlogo.png"
  color_dark: "#0D1B2A"
  image_dark: "assets/splashscreenlogo.png"
  android_12:
    color: "#0D1B2A"
    image: "assets/splash_a12_safe.png"
    color_dark: "#0D1B2A"
    image_dark: "assets/splash_a12_safe.png"



